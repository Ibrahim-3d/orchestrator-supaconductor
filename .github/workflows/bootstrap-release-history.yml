name: Bootstrap v3.7.0 Release History

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish missing historical v3.7.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v3.7.0 >/dev/null 2>&1; then
            echo "v3.7.0 already exists; nothing to bootstrap."
            exit 0
          fi

          TARGET="c1177bc36ff043f14332d2f0f00b9adfc9f41a66"

          git tag v3.7.0 "$TARGET"
          git push origin v3.7.0

          cat > /tmp/v3.7.0-notes.md <<'EOF'
          SupaConductor v3.7.0 hardens the Evaluate-Loop for long-running autonomous work while cutting unnecessary board cost.

          ### What's New
          - **Board fast-path** — routine tracks use one structured Opus evaluation across all five board lenses; full multi-agent deliberation is reserved for high-stakes work.
          - **Plan revision guard** — prevents repeated PLAN → EVALUATE_PLAN loops from running indefinitely.
          - **Execution state reconciliation** — completed plan tasks are reconciled on resume so interrupted sessions do not redo finished work.
          - **Bounded knowledge injection** — only the most relevant knowledge entries are injected, with a hard token cap.

          ### Fixes
          - Replaced the message bus check-then-write lock with an OS-level atomic file lock.
          - Corrected state persistence and plan-revision edge cases.
          - Hardened release automation and version propagation.

          ### Update
          ```bash
          claude plugin marketplace update ibrahim-plugins
          claude plugin update orchestrator-supaconductor@ibrahim-plugins
          ```

          See [CHANGELOG.md](https://github.com/Ibrahim-3d/orchestrator-supaconductor/blob/master/CHANGELOG.md) for the detailed history.
          EOF

          sed -i 's/^          //' /tmp/v3.7.0-notes.md

          gh release create v3.7.0 \
            --target "$TARGET" \
            --title "SupaConductor v3.7.0" \
            --notes-file /tmp/v3.7.0-notes.md
