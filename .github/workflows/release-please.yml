name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  discussions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        continue-on-error: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
          skip-github-release: true

  publish-current-version:
    needs: release-please
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.publish.outputs.release_created }}
      tag_name: ${{ steps.publish.outputs.tag_name }}
      html_url: ${{ steps.publish.outputs.html_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish version and platform packages
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(python3 - <<'PYEOF'
          import json
          with open(".release-please-manifest.json", encoding="utf-8") as f:
              print(json.load(f)["."])
          PYEOF
          )
          TAG="v${VERSION}"

          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            URL=$(gh release view "${TAG}" --json url --jq '.url')
            echo "release_created=false" >> "$GITHUB_OUTPUT"
            echo "html_url=${URL}" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists; nothing to publish."
            exit 0
          fi

          python3 scripts/build-platform-adapters.py --output dist/platforms

          for platform in codex cursor antigravity windsurf copilot; do
            (
              cd dist/platforms
              zip -qr "../../supaconductor-${platform}.zip" "${platform}/orchestrator-supaconductor"
            )
          done

          python3 - "${VERSION}" <<'PYEOF'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"(?ms)^## \[{re.escape(version)}\].*?(?=^## \[|\Z)",
              text,
          )
          if match:
              body = match.group(0).strip()
          else:
              body = f"SupaConductor {version}"
          Path("/tmp/release-notes.md").write_text(body + "\n", encoding="utf-8")
          PYEOF

          gh release create "${TAG}"             supaconductor-codex.zip             supaconductor-cursor.zip             supaconductor-antigravity.zip             supaconductor-windsurf.zip             supaconductor-copilot.zip             --target "${GITHUB_SHA}"             --title "${TAG}"             --notes-file /tmp/release-notes.md

          URL=$(gh release view "${TAG}" --json url --jq '.url')
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "html_url=${URL}" >> "$GITHUB_OUTPUT"

  announce:
    needs: publish-current-version
    if: ${{ needs.publish-current-version.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Discussions category
        id: discussion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT=$(gh api graphql -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                id
                discussionCategories(first: 20) {
                  nodes { id name }
                }
              }
            }' \
            -f owner="${{ github.repository_owner }}" \
            -f name="${{ github.event.repository.name }}")

          REPO_ID=$(echo "$RESULT" | jq -r '.data.repository.id')
          CATEGORY_ID=$(echo "$RESULT" | jq -r '
            .data.repository.discussionCategories.nodes[]
            | select(.name == "Announcements") | .id' | head -1)

          if [ -z "$CATEGORY_ID" ]; then
            CATEGORY_ID=$(echo "$RESULT" | jq -r '
              .data.repository.discussionCategories.nodes[]
              | select(.name == "General") | .id' | head -1)
          fi

          echo "repo_id=$REPO_ID" >> "$GITHUB_OUTPUT"
          echo "category_id=$CATEGORY_ID" >> "$GITHUB_OUTPUT"

      - name: Publish release announcement
        if: ${{ steps.discussion.outputs.category_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ID: ${{ steps.discussion.outputs.repo_id }}
          CATEGORY_ID: ${{ steps.discussion.outputs.category_id }}
          RELEASE_TAG: ${{ needs.publish-current-version.outputs.tag_name }}
          RELEASE_URL: ${{ needs.publish-current-version.outputs.html_url }}
        run: |
          export RELEASE_BODY=$(gh release view "$RELEASE_TAG" --json body --jq '.body')

          python3 - <<'PYEOF'
          import os

          tag = os.environ["RELEASE_TAG"]
          body = os.environ.get("RELEASE_BODY", "").strip()
          url = os.environ["RELEASE_URL"]

          content = f"""## SupaConductor {tag}

          {body}

          ---

          **Update**
          ```bash
          claude plugin marketplace update ibrahim-plugins
          claude plugin update orchestrator-supaconductor@ibrahim-plugins
          ```

          **Full release:** {url}
          """.strip()

          with open("/tmp/discussion_body.md", "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

          gh api graphql \
            -f query='
              mutation CreateDiscussion(
                $repositoryId: ID!,
                $categoryId: ID!,
                $title: String!,
                $body: String!
              ) {
                createDiscussion(input: {
                  repositoryId: $repositoryId
                  categoryId: $categoryId
                  title: $title
                  body: $body
                }) {
                  discussion { url }
                }
              }' \
            -f repositoryId="$REPO_ID" \
            -f categoryId="$CATEGORY_ID" \
            -f title="SupaConductor $RELEASE_TAG released" \
            -f body="$(cat /tmp/discussion_body.md)"
